name: Auto Update M3U Playlist

on:
  schedule:
    - cron: '*/5 * * * *' # প্রতি ১৫ মিনিট পরপর আপডেট হবে (আপনি চাইলে সময় বদলাতে পারবেন)
  workflow_dispatch: # ম্যানুয়ালি রান করানোর অপশন

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18' # Fetch API সাপোর্ট করার জন্য Node 18 ব্যবহার করা হচ্ছে

      - name: Run Script to Generate M3U
        run: node generate.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add playlist.m3u
          git commit -m "Auto-update playlist.m3u" || echo "No changes to commit"
          git push
