name: Auto Update M3U Playlists

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: 

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Generate Toffee M3U
        run: node generate-toffee.js

      - name: Generate Verse M3U
        run: node generate-verse.js

      - name: Generate Criticx M3U
        run: node generate-criticx.js

      - name: Generate SM Live M3U
        run: node generate-smlive.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Auto-update all playlists including SM Live" || echo "No changes to commit"
          git push
